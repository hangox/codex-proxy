name: Bump version + release

on:
  # fork 内不要定时改 master，需要发布时手动触发。
  workflow_dispatch:

concurrency:
  group: bump-version
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Check for new commits since last tag
        id: check
        run: |
          # package.json 是版本系列来源；最终 bump 基准取 package.json 和最新 stable tag 的较大值。
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          IFS='.' read -r PKG_MAJOR PKG_MINOR _PKG_PATCH <<< "$PKG_VERSION"
          SERIES="${PKG_MAJOR}.${PKG_MINOR}"

          # 只匹配当前系列的 stable tag，排除 beta tag。
          LAST_TAG=$(git tag --sort=-v:refname | grep -E "^v${SERIES}\.[0-9]+$" | head -1 || echo "")
          if [ -z "$LAST_TAG" ]; then
            BASE_VERSION="$PKG_VERSION"
            # 新系列第一次发布时，用任意旧 stable tag 做改动检查。
            LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo "")
            if [ -z "$LAST_TAG" ]; then
              echo "No previous tag, skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "New series ${SERIES}.x — will start at ${SERIES}.0"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "new_series=true" >> "$GITHUB_OUTPUT"
            echo "series=$SERIES" >> "$GITHUB_OUTPUT"
            echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
            echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG_VERSION="${LAST_TAG#v}"
          BASE_VERSION=$(node -e "
            const [pkg, tag] = process.argv.slice(1);
            const cmp = (a, b) => {
              const pa = a.split('.').map(Number);
              const pb = b.split('.').map(Number);
              for (let i = 0; i < 3; i++) {
                if (pa[i] !== pb[i]) return pa[i] - pb[i];
              }
              return 0;
            };
            console.log(cmp(pkg, tag) >= 0 ? pkg : tag);
          " "$PKG_VERSION" "$TAG_VERSION")

          SKIP_RELEASE_PATTERN="^(chore|docs|ci|test|refactor|style)(\\(.*\\))?:|^fix: generate stable notes from dev promotion history"
          NEW_COMMITS=$(git log "${LAST_TAG}..HEAD" --no-merges \
            --pretty=format:"%s" | grep -cvE "$SKIP_RELEASE_PATTERN" || true)
          if [ "$NEW_COMMITS" -eq 0 ]; then
            echo "No meaningful commits since $LAST_TAG, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUNTIME_CHANGED_FILES=$(git diff --name-only "${LAST_TAG}..HEAD" -- . \
            ':(exclude).github/**' \
            ':(exclude)tests/**' \
            ':(exclude)README.md' \
            ':(exclude)README_EN.md' \
            ':(exclude)CHANGELOG.md' \
            ':(exclude)DESIGN.md')
          if [ -z "$RUNTIME_CHANGED_FILES" ]; then
            echo "No runtime files changed since $LAST_TAG, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found $NEW_COMMITS new commit(s) since $LAST_TAG"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "series=$SERIES" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump version + tag
        id: bump
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SERIES="${{ steps.check.outputs.series }}"
          if [ "${{ steps.check.outputs.new_series }}" = "true" ]; then
            NEW_VERSION="${{ steps.check.outputs.base_version }}"
          else
            CURRENT="${{ steps.check.outputs.base_version }}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          NEW_TAG="v${NEW_VERSION}"

          # Check tag doesn't already exist
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists, skipping"
            exit 0
          fi

          # 同步根包、Electron 包版本以及 lock 元数据。
          node -e "
            const fs = require('fs');
            const NEW_VERSION = '${NEW_VERSION}';
            for (const p of ['package.json', 'packages/electron/package.json']) {
              const pkg = JSON.parse(fs.readFileSync(p, 'utf-8'));
              pkg.version = NEW_VERSION;
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            }
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf-8'));
            lock.version = NEW_VERSION;
            lock.packages[''].version = NEW_VERSION;
            lock.packages['packages/electron'].version = NEW_VERSION;
            fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          "

          git add package.json packages/electron/package.json package-lock.json
          # 版本已经一致时只打 tag。
          if git diff --cached --quiet; then
            echo "package.json already at ${NEW_VERSION}, tagging without version commit"
          else
            git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          fi
          git tag -a "$NEW_TAG" -m "Release ${NEW_TAG}"

          # push 冲突时 rebase 后重试。
          for i in 1 2 3; do
            if git push origin master --follow-tags; then
              echo "Bumped to $NEW_VERSION, tagged $NEW_TAG"
              echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push failed (attempt $i/3), rebasing and retrying..."
            git tag -d "$NEW_TAG"
            git pull --rebase origin master
            git tag -a "$NEW_TAG" -m "Release ${NEW_TAG}"
            sleep 2
          done
          echo "::error::Push failed after 3 attempts"
          exit 1

      - name: Sync bump commit back to dev (FF)
        if: steps.bump.outputs.new_tag
        # 如果仓库真的有 dev 分支，把 stable bump 同步回去，避免下一次 promote 卡住。
        run: |
          if ! git ls-remote --exit-code --heads origin refs/heads/dev >/dev/null 2>&1; then
            echo "dev branch does not exist, skipping sync"
            exit 0
          fi
          git fetch origin refs/heads/dev:refs/remotes/origin/dev
          if git push origin master:refs/heads/dev; then
            echo "Synced master ($(git rev-parse master)) to dev (FF)"
          else
            echo "::warning::FF push master:dev refused (dev moved during bump window). Manual sync needed."
          fi

      - name: Trigger release workflow
        if: steps.bump.outputs.new_tag
        run: |
          echo "Dispatching release for $NEW_TAG"
          gh workflow run release.yml -f tag="$NEW_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}

      - name: Trigger docker publish
        # GITHUB_TOKEN-driven pushes do not fire downstream workflows, so the bump
        # commit + tag won't trip docker-publish.yml's push trigger on its own.
        # Dispatching workflow_run here ensures ghcr.io/.../codex-proxy:vX.Y.Z
        # exists for the version we just tagged.
        if: steps.bump.outputs.new_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker-publish.yml --ref master
