name: Publish Docker Image

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # `fetch-tags: true`（不带 fetch-depth: 0）在 tag push 触发时会撞上
      # actions/checkout 的已知 bug（upstream #1467，@v4 未修，v6.0.2 才修）：
      # checkout 触发 ref 本身就是 refs/tags/vX.Y.Z 时，"把触发 commit 的 SHA
      # 写进 refs/tags/vX.Y.Z" 和 "拉取全部 tags 也会写同一个 refs/tags/vX.Y.Z"
      # 两个 refspec 在同一次 git fetch 里冲突，报
      # `Cannot fetch both <sha> and refs/tags/vX.Y.Z to refs/tags/vX.Y.Z`，
      # checkout 直接失败——release 推 v2.0.83 tag 触发发布时复现过。
      # 用 `--ref v2.0.83` 手动重跑 workflow_dispatch 会撞同一个错误，
      # 因为 workflow_dispatch 选中一个 tag 时 github.ref 同样是 refs/tags/*。
      #
      # 改成 fetch-depth: 0 修复：查过 actions/checkout 源码
      # （ref-helper.ts 的 getRefSpecForAllHistory），fetch-depth: 0 触发的
      # "全历史"分支无论 fetch-tags 是否设置都会无条件带上
      # +refs/tags/*:refs/tags/*，且这条路径只做两个通配符 refspec
      # （refs/heads/* 和 refs/tags/*），不会构造"把某个具体 SHA 写进某个
      # 具体 tag ref"这种会和通配符冲突的 refspec，天然避开这个 bug——
      # LATEST_STABLE（Read version 用来防版本回退）需要的"全部 tags"因此
      # 照样满足，不依赖 fetch-tags。
      #
      # 没有加显式 ref:（一开始加过，后来验证后去掉了）：查过
      # input-helper.ts，同仓库（非 fork）checkout 在 ref 输入为空时会把
      # settings.ref/settings.commit 直接设成 github.context.ref/sha——和
      # 显式写 ref: ${{ github.ref }} 解析出来的值完全相同，纯冗余，不改变
      # 任何实际行为。之前误加是因为 upstream issue #1467 讨论串里有多个
      # 独立复现者报告"加了 ref: 之后就好了"，但那些报告很可能是巧合
      # （@v4/@v5 是浮动 tag，他们测试的间隔内可能刚好也捡到了一次补丁版本
      # 更新，把功劳错记给了加的那行配置）——源码层面这行不可能改变任何
      # 已解析出来的 settings 值，留着只会让后来人误以为它承担了什么作用。
      #
      # 没有直接升级到 actions/checkout@v6（虽然 v6.0.2 官方修了这个 bug，
      # 是更"治本"的修法）：v5.0.0 起对运行 action 本身的 Node 版本、
      # runner 最低版本有新要求（GitHub 托管的 ubuntu-latest 会自动满足，
      # 但这是一条本仓库从未验证过的新约束）；v6.0.0 改了凭据持久化方式
      # （"Persist creds to a separate file"）——这类行为变化没法在当前
      # 环境里跑一次真实 GitHub Actions runner 去验证，只能凭 changelog
      # 文字判断，而这条 workflow 恰恰是"挡着发布、优先级最高"的那条，
      # 不适合承担一次没有实测过的跨大版本升级风险。相比之下 fetch-depth: 0
      # 这条路径已经在本仓库的 release.yml 里对着同样的"tag push 触发 +
      # 需要全部 tags"场景跑通过生产发布（v2.0.83 桌面端 14 个资产已经
      # 正常发出），是有真实生产验证的既有先例，不是本仓库首次尝试。
      #
      # 权衡：0f65218（#430）当初从 fetch-depth: 0 换成 fetch-tags: true 是
      # 为了"更轻量的 checkout"。这次换回去是刻意的取舍——发布路径完全
      # 打不出 tag 是更严重的问题，而且这个仓库体积很小（.git 18M，164 个
      # tag），全历史 fetch 的耗时相对这一步之后的多平台 buildx 构建
      # （linux/amd64+arm64，QEMU 模拟）可以忽略不计，不是一个值得为了这点
      # checkout 耗时去承受"发布链路随时可能断"的权衡。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          LATEST_STABLE=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//' || echo "0.0.0")
          FINAL=$(node -e "
            const [a, b] = ['$PKG_VERSION', '$LATEST_STABLE'];
            const cmp = (x, y) => {
              const pa = x.split('.').map(Number);
              const pb = y.split('.').map(Number);
              for (let i = 0; i < 3; i++) {
                if (pa[i] !== pb[i]) return pa[i] - pb[i];
              }
              return 0;
            };
            console.log(cmp(a, b) >= 0 ? a : b);
          ")
          echo "version=$FINAL" >> "$GITHUB_OUTPUT"

      - name: Resolve image name
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          # vX.Y.Z 这条必须带 enable 守卫，否则每次 push master 都会把它
          # 重新指向当次构建产物——Read version 算的是 max(package.json,
          # 已有最高 stable tag)，master 推送时这个值和上一次发布时完全
          # 相同，于是变成"每次日常提交都悄悄改写已发布版本 tag 指向"，
          # 构建全绿、无报错，只有比对 digest 才发现（v2.0.82 的真实事故）。
          # 只在触发事件本身就是 vX.Y.Z 标签时才产出这个 tag——覆盖两条
          # 真实路径：(a) push tag 触发（release 流程）；(b) workflow_dispatch
          # 手动对着一个已有 tag 重跑（release.yml 同款 workflow_dispatch
          # 手动指定 tag 的用法在这个仓库里是既有模式）。用 github.ref 而不是
          # github.event_name 判断，是因为 workflow_dispatch 永远不会满足
          # type=ref,event=tag 要求的"事件类型本身是 tag push"，但选中的 ref
          # 仍然可以是一个 tag——按事件类型判断会漏掉手动重跑这条路径。
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ steps.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
