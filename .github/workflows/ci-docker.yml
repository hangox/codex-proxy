name: CI — Docker smoke test

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "docker-healthcheck.sh"
      - "docker-compose.yml"
      - "package*.json"
      - "src/**"
      - "web/**"
      - "shared/**"
      - "config/**"
      - "scripts/**"
  push:
    branches: [master]
    # Must stay in sync with the pull_request paths above: docker-publish.yml
    # ships every master push, so anything that can break container startup
    # (e.g. a new `node:sqlite` import) has to be smoke-tested here first.
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "docker-healthcheck.sh"
      - "docker-compose.yml"
      - "package*.json"
      - "src/**"
      - "web/**"
      - "shared/**"
      - "config/**"
      - "scripts/**"

concurrency:
  group: ci-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t codex-proxy:smoke .

      - name: Verify runtime Node version supports node:sqlite
        run: |
          NODE_VERSION=$(docker run --rm --entrypoint node codex-proxy:smoke -v)
          echo "image node version: $NODE_VERSION"
          MAJOR=$(echo "${NODE_VERSION#v}" | cut -d. -f1)
          MINOR=$(echo "${NODE_VERSION#v}" | cut -d. -f2)
          # node:sqlite ships unflagged from Node 22.13.0 onwards.
          if [ "$MAJOR" -lt 22 ] || { [ "$MAJOR" -eq 22 ] && [ "$MINOR" -lt 13 ]; }; then
            echo "::error::Runtime Node $NODE_VERSION is older than 22.13.0 and cannot load node:sqlite"
            exit 1
          fi

      - name: Verify node:sqlite is loadable inside the image
        run: |
          docker run --rm --entrypoint node codex-proxy:smoke \
            --input-type=module \
            -e "import { DatabaseSync } from 'node:sqlite'; const db = new DatabaseSync(':memory:'); db.exec('CREATE TABLE t (a INTEGER)'); db.close(); console.log('node:sqlite OK');"

      - name: Verify app entrypoint boots without ERR_UNKNOWN_BUILTIN_MODULE
        run: |
          set +e
          OUT=$(docker run --rm --entrypoint node codex-proxy:smoke \
            -e "import('/app/dist/routes/shared/opaque-compact-repository.js').then(() => console.log('opaque compact module OK')).catch((err) => { console.error(err); process.exit(1); });" 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then
            echo "::error::opaque compact persistence module failed to load in the image"
            exit 1
          fi

      - name: Start container
        run: |
          docker run -d --name smoke-test \
            -p 18080:8080 \
            -e NODE_ENV=production \
            codex-proxy:smoke
          echo "Container started"

      - name: Wait for healthy
        run: |
          echo "Waiting for container to become healthy..."
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' smoke-test 2>/dev/null || echo "starting")
            echo "  [$i/30] status: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container did not become healthy within 60s"
          docker logs smoke-test
          exit 1

      - name: Verify /health endpoint
        run: |
          RESPONSE=$(curl -sf http://localhost:18080/health)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | jq -e '.status == "ok"'

      - name: Verify /v1/models returns valid JSON
        run: |
          # Without auth, should return 401 or model list — either way must be valid JSON
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/v1/models)
          echo "/v1/models status: $STATUS"
          # 200 (no key set) or 401 (key set) are both acceptable
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "401" ]; then
            echo "::error::Unexpected status $STATUS from /v1/models"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          docker logs smoke-test 2>&1 | tail -30
          docker rm -f smoke-test || true
