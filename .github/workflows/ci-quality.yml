name: CI - Quality gate

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]
  # 触发不可靠是这个仓库的已知事实（见 CLAUDE.md「docker-publish.yml 的
  # 历史坑」坑 3），docker-publish.yml/release.yml 都已经靠 workflow_dispatch
  # 作为手动补跑的安全阀。2026-08-03 发 v2.0.95 后续修复时，这条门禁本身
  # 撞到了同一个形状——一次纯文档 push 迟迟没有触发它，而它当时没有
  # workflow_dispatch，补跑不了。任何被列为发布前必看的 workflow 都要有
  # 这个安全阀，不是可选装饰。见 tests/unit/ci/release-workflows-have-manual-dispatch.test.ts。
  workflow_dispatch:

concurrency:
  group: ci-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run package/update boundary guards
        run: npx vitest run tests/unit/ci/package-boundary.test.ts tests/unit/update-scripts-path.test.ts tests/unit/update-checker.test.ts

      - name: Type-check public update scripts
        run: npm run typecheck:scripts

      # ★ #83：tests/ 目录不在根 tsconfig.json 的 include 范围内，vitest 用
      # esbuild 转译时也只剥类型不做类型检查——如果没有这一步，
      # recompact-failure-cause-exhaustiveness.test.ts 里穷尽性 switch 的
      # `default: { const x: never = ... }` 只是摆设，新增
      # OpaqueCompactStateFailure 字面量却漏改分类不会让任何现有 CI 步骤变红。
      # 见 tsconfig.test-guards.json 顶部注释。
      - name: Type-check exhaustiveness guard tests
        run: npm run typecheck:test-guards
