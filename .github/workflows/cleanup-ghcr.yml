name: Cleanup GHCR tags

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete specified SHA tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: codex-proxy
        run: |
          TARGETS=("sha-dda2a82" "sha-bc2d134")
          echo "Looking for package versions to delete: ${TARGETS[*]}"

          # In GitHub Actions, GITHUB_TOKEN has access via the repo package endpoint or user package endpoint
          VERSIONS=$(gh api --paginate "/user/packages/container/${PACKAGE_NAME}/versions" 2>/dev/null || gh api --paginate "/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions")

          for target in "${TARGETS[@]}"; do
            echo "Checking for $target..."
            VERSION_ID=$(echo "$VERSIONS" | jq -r --arg tag "$target" '.[] | select(.metadata.container.tags[]? == $tag) | .id')
            if [ -n "$VERSION_ID" ] && [ "$VERSION_ID" != "null" ]; then
              echo "Found $target with version id $VERSION_ID, deleting..."
              gh api -X DELETE "/user/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}" 2>/dev/null || \
              gh api -X DELETE "/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}"
              echo "Successfully deleted $target"
            else
              echo "Version with tag $target not found or already deleted"
            fi
          done
